interface:
  display_name: "日报生成助手"
  short_description: "根据当天 Codex 对话历史和真实 Git 改动，整理自然好懂的中文日报"
  default_prompt: "Use $daily_report to read today's Codex session history, infer related Git repositories from session_meta.payload.cwd, then combine conversation items with each repository's real commits and workspace changes to write a natural, non-templated Chinese daily work report without modifying project code or creating commits."

policy:
  allow_implicit_invocation: true
