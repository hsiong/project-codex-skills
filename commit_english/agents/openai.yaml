interface:
  display_name: "English Commit Splitter"
  short_description: "Block TODOs and sensitive data, then split English commits"
  default_prompt: "Use $commit_english to stop and report TODOs or real sensitive data in candidate files; otherwise split Git-known changes into safe English conventional commits by concrete functional flow and summarize the total changed lines."

policy:
  allow_implicit_invocation: true
