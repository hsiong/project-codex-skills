interface:
  display_name: "GitHub Issue Writer"
  short_description: "基于当前 Git 修改查重并生成 file/issue/*.md 草稿"
  default_prompt: "Use $github-issue-generator to read the relevant git diff, split the changes into one or more issue candidates, check for similar issues first, then write English Markdown issue drafts under file/issue/ from the repository template if needed."

policy:
  allow_implicit_invocation: true
